apiVersion: batch/v1
kind: Job
metadata:
  name: resumer-migrate
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: resumer-platform
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: ghcr.io/OWNER/myresumer/backend:latest
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
