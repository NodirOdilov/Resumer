apiVersion: batch/v1
kind: Job
metadata:
  name: resumer-seed
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-seed
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: resumer-platform
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-seed
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          image: ghcr.io/OWNER/myresumer/backend:latest
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - seed_data
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
