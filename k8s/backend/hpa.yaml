apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resumer-backend-hpa
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: resumer-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resumer-backend
  minReplicas: 3
  maxReplicas: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
      selectPolicy: Min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
