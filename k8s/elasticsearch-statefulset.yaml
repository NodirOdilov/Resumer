apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resumer-elasticsearch
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-elasticsearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: resumer-platform
spec:
  serviceName: resumer-elasticsearch
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-elasticsearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: resumer-platform
    spec:
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              protocol: TCP
              name: http
            - containerPort: 9300
              protocol: TCP
              name: transport
          env:
            - name: cluster.name
              value: resumer-es-cluster
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: discovery.seed_hosts
              value: "resumer-elasticsearch-0.resumer-elasticsearch,resumer-elasticsearch-1.resumer-elasticsearch,resumer-elasticsearch-2.resumer-elasticsearch"
            - name: cluster.initial_master_nodes
              value: "resumer-elasticsearch-0,resumer-elasticsearch-1,resumer-elasticsearch-2"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: resumer-elasticsearch
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-elasticsearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: resumer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resumer-elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
      name: http
    - port: 9300
      targetPort: 9300
      protocol: TCP
      name: transport
