apiVersion: v1
kind: ConfigMap
metadata:
  name: resumer-config
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer
    app.kubernetes.io/part-of: resumer-platform
data:
  # Django
  DJANGO_SETTINGS_MODULE: "config.settings.production"
  DEBUG: "False"
  ALLOWED_HOSTS: "resumer.com,www.resumer.com"
  CSRF_TRUSTED_ORIGINS: "https://resumer.com,https://www.resumer.com"

  # Database
  POSTGRES_DB: "resumer"
  POSTGRES_HOST: "resumer-postgresql"
  POSTGRES_PORT: "5432"

  # PgBouncer
  PGBOUNCER_HOST: "resumer-pgbouncer"
  PGBOUNCER_PORT: "6432"

  # Redis
  REDIS_URL: "redis://resumer-redis:6379/0"
  CELERY_BROKER_URL: "redis://resumer-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://resumer-redis:6379/2"

  # Elasticsearch
  ELASTICSEARCH_URL: "http://resumer-elasticsearch:9200"

  # Email
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_USE_TLS: "True"

  # Frontend
  NEXT_PUBLIC_API_URL: "https://resumer.com/api"
  NEXT_PUBLIC_SITE_URL: "https://resumer.com"

  # Gunicorn
  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "120"

  # Celery
  CELERY_WORKER_CONCURRENCY: "4"

  # WeasyPrint
  WEASYPRINT_DPI: "96"
