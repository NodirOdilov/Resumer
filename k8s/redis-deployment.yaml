apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-redis
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: redis
          image: redis:8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              protocol: TCP
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: resumer-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resumer-redis-data
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: resumer-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: resumer-redis
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: resumer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resumer-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
