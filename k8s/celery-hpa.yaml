apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resumer-celery-hpa
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: resumer-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resumer-celery
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
