apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-celery-beat
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery-beat
    app.kubernetes.io/component: celery-beat
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-celery-beat
      app.kubernetes.io/component: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-celery-beat
        app.kubernetes.io/component: celery-beat
        app.kubernetes.io/part-of: resumer-platform
    spec:
      serviceAccountName: resumer-celery
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: celery-beat
          image: ghcr.io/OWNER/myresumer/backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test $(find /tmp/celerybeat-schedule -mmin -5 2>/dev/null | wc -l) -gt 0 || pgrep -f 'celery.*beat'"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
