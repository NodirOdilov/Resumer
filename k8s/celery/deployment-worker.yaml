apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-celery-worker
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery-worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-celery-worker
      app.kubernetes.io/component: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-celery-worker
        app.kubernetes.io/component: celery-worker
        app.kubernetes.io/part-of: resumer-platform
    spec:
      serviceAccountName: resumer-celery
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: celery-worker
          image: ghcr.io/OWNER/myresumer/backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - -Q
            - high,default,low
            - --concurrency=4
            - --max-tasks-per-child=1000
            - --without-heartbeat
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping --destination celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping --destination celery@$HOSTNAME
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: resumer-media-pvc
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: resumer-celery-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resumer-celery
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery
    app.kubernetes.io/component: celery
