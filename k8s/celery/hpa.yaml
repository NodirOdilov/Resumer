apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resumer-celery-worker-hpa
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery-worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: resumer-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resumer-celery-worker
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
      selectPolicy: Min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
