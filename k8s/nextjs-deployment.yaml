apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-frontend
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: resumer-frontend
          image: resumer/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "400m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
