apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resumer-ingress
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer
    app.kubernetes.io/part-of: resumer-platform
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: nginx

    # TLS / cert-manager
    cert-manager.io/cluster-issuer: letsencrypt-production

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"

    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "resumer-backend"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://resumer.com,https://www.resumer.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # HSTS
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - resumer.com
        - www.resumer.com
      secretName: resumer-tls
  rules:
    - host: resumer.com
      http:
        paths:
          # API routes → backend
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: resumer-backend
                port:
                  number: 8000

          # Admin panel → backend
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: resumer-backend
                port:
                  number: 8000

          # WebSocket connections → backend
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: resumer-backend
                port:
                  number: 8000

          # Django static files (if served by backend)
          - path: /static/admin/
            pathType: Prefix
            backend:
              service:
                name: resumer-backend
                port:
                  number: 8000

          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resumer-frontend
                port:
                  number: 3000

    - host: www.resumer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resumer-frontend
                port:
                  number: 3000
