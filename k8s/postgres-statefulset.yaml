apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resumer-postgresql
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: resumer-platform
  annotations:
    description: "For dev/staging only. Production should use a managed database service."
spec:
  serviceName: resumer-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: postgresql
          image: postgres:18
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgresql
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: resumer-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: resumer-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resumer-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: resumer-postgresql
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: resumer-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: resumer-postgresql
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
