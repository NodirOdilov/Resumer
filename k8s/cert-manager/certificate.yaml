apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: resumer-tls
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer
    app.kubernetes.io/part-of: resumer-platform
spec:
  secretName: resumer-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: resumer.com
  dnsNames:
    - resumer.com
    - www.resumer.com
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 720h  # 30 days before expiry
