apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-frontend
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-frontend
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: resumer-platform
    spec:
      serviceAccountName: resumer-frontend
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/OWNER/myresumer/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: resumer-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: resumer-config
                  key: NEXT_PUBLIC_SITE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: resumer-frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resumer-frontend
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-frontend
    app.kubernetes.io/component: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: resumer-frontend-pdb
  namespace: resumer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-frontend
      app.kubernetes.io/component: frontend
