apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resumer-frontend-hpa
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: resumer-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resumer-frontend
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
      selectPolicy: Min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
