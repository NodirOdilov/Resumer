apiVersion: v1
kind: Secret
metadata:
  name: resumer-secrets
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer
    app.kubernetes.io/part-of: resumer-platform
type: Opaque
stringData:
  # Django
  SECRET_KEY: "CHANGE_ME_TO_A_REAL_SECRET_KEY"

  # Database
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://CHANGE_ME:CHANGE_ME@resumer-postgresql:5432/resumer"

  # Email
  EMAIL_HOST: "CHANGE_ME"
  EMAIL_PORT: "587"
  EMAIL_HOST_USER: "CHANGE_ME"
  EMAIL_HOST_PASSWORD: "CHANGE_ME"

  # AWS S3 Storage
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_STORAGE_BUCKET_NAME: "CHANGE_ME"
  AWS_S3_REGION_NAME: "CHANGE_ME"

  # OAuth
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  GITHUB_CLIENT_ID: "CHANGE_ME"
  GITHUB_CLIENT_SECRET: "CHANGE_ME"

  # AI Features
  OPENAI_API_KEY: "CHANGE_ME"
  OPENAI_MODEL: "gpt-4"

  # Sentry
  SENTRY_DSN: "CHANGE_ME"
