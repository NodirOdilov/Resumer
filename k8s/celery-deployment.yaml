apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-celery
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-celery
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: resumer-celery
          image: resumer/api:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - -Q
            - high,default,low
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      restartPolicy: Always
