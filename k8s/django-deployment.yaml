apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-api
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: resumer-api
          image: resumer/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
      restartPolicy: Always
