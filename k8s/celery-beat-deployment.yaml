apiVersion: apps/v1
kind: Deployment
metadata:
  name: resumer-celery-beat
  namespace: resumer
  labels:
    app.kubernetes.io/name: resumer-celery-beat
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: resumer-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: resumer-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resumer-celery-beat
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/part-of: resumer-platform
    spec:
      containers:
        - name: resumer-celery-beat
          image: resumer/api:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - config
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: resumer-config
            - secretRef:
                name: resumer-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
