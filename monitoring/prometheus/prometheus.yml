global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Django application metrics via django-prometheus
  - job_name: "django"
    metrics_path: "/prometheus/metrics"
    static_configs:
      - targets:
          - "web:8000"
        labels:
          service: "resumer-api"
          environment: "production"
    scrape_interval: 10s

  # Node exporter for host metrics
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node"
          environment: "production"

  # Redis exporter
  - job_name: "redis-exporter"
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "redis"
          environment: "production"

  # PostgreSQL exporter
  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgresql"
          environment: "production"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
