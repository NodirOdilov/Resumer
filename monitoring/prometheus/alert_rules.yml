groups:
  - name: resumer_high_error_rate
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: resumer-api
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP responses are returning 5xx errors over the last 5 minutes. Current value: {{ $value | humanizePercentage }}"

      - alert: HighClientErrorRate
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"4.."}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > 0.25
        for: 10m
        labels:
          severity: warning
          service: resumer-api
        annotations:
          summary: "High HTTP 4xx error rate"
          description: "More than 25% of HTTP responses are returning 4xx errors. Current value: {{ $value | humanizePercentage }}"

  - name: resumer_slow_response
    rules:
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          service: resumer-api
        annotations:
          summary: "Slow API response times"
          description: "95th percentile response time exceeds 2 seconds. Current p95: {{ $value | humanizeDuration }}"

      - alert: VerySlowResponseTime
        expr: |
          histogram_quantile(0.99,
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)
          ) > 5.0
        for: 5m
        labels:
          severity: critical
          service: resumer-api
        annotations:
          summary: "Very slow API response times"
          description: "99th percentile response time exceeds 5 seconds. Current p99: {{ $value | humanizeDuration }}"

  - name: resumer_disk_space
    rules:
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          service: node
        annotations:
          summary: "Low disk space"
          description: "Less than 15% disk space remaining on root filesystem. Available: {{ $value | humanizePercentage }}"

      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.05
        for: 5m
        labels:
          severity: critical
          service: node
        annotations:
          summary: "Critical disk space"
          description: "Less than 5% disk space remaining on root filesystem. Available: {{ $value | humanizePercentage }}"

  - name: resumer_memory
    rules:
      - alert: HighMemoryUsage
        expr: |
          (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          service: node
        annotations:
          summary: "High memory usage"
          description: "Memory usage exceeds 85%. Current usage: {{ $value | humanizePercentage }}"

      - alert: CriticalMemoryUsage
        expr: |
          (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) > 0.95
        for: 5m
        labels:
          severity: critical
          service: node
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage exceeds 95%. Current usage: {{ $value | humanizePercentage }}"

  - name: resumer_database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance is not responding to queries."

      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_activity_count
          /
          pg_settings_max_connections > 0.80
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "PostgreSQL connection usage exceeds 80% of max_connections."

  - name: resumer_redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis instance is not responding."

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes
          /
          redis_memory_max_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage exceeds 85% of configured maximum."
